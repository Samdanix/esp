services:
  - type: web
    name: library-noise-monitor-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GREEN_MAX
        value: "55"
      - key: YELLOW_MAX
        value: "70"
      - key: DB_PATH
        value: noise_monitor.db
    healthCheckPath: /health
